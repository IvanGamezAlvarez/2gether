<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile editable</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="profileEditable.css" />
  </head>

  <body>
    <header>
      <div id="navbar"></div>
    </header>
    <div class="text-center position-relative">
      <!-- Banner clickeable -->
      <div class="banner-container position-relative">
        <img
          src="/public/img/profileEditable/head-background.png"
          alt="blue background editable"
          class="w-100 banner-image"
          id="bannerImage"
        />
        <div
          class="banner-overlay position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center"
        >
          <button
            type="button"
            class="btn-edit-discreto btn-edit-discreto-lg"
            onclick="document.getElementById('bannerInput').click()"
          >
            <i class="bi bi-pencil"></i>
          </button>
        </div>
        <input
          type="file"
          id="bannerInput"
          accept="image/*"
          style="display: none"
          onchange="cambiarBanner(this)"
        />
      </div>

      <!-- Avatar posicionado encima del banner -->
      <div class="avatar-wrapper position-relative">
        <div class="avatar-container position-relative d-inline-block">
          <img
            class="avatar"
            src="/public/img/profileEditable/image-profile-generic.png"
            alt="Profile pic generic"
            id="avatarImage"
          />
          <button
            type="button"
            class="btn-edit-discreto btn-edit-discreto-lg"
            onclick="document.getElementById('avatarInput').click()"
          >
            <i class="bi bi-camera-fill"></i>
          </button>
          <input
            type="file"
            id="avatarInput"
            accept="image/*"
            style="display: none"
            onchange="cambiarAvatar(this)"
          />
        </div>
      </div>

      <!-- Username con botón funcional -->
      <div class="d-flex align-items-center justify-content-center gap-2 mt-3">
        <h2 class="mb-0" id="usernameText">Username</h2>
        <button
          type="button"
          class="btn-edit-discreto btn-edit-discreto-sm"
          id="editUsernameBtn"
          onclick="editarUsername()"
        >
          <i class="bi bi-pencil"></i>
        </button>
      </div>
      <button type="button" class="btn btn-secondary px-5 mt-2">
        Guardar cambios
      </button>
      <div class="mt-3 text-center mb-4">
            <div
              class="d-flex justify-content-center align-items-center gap-2 mb-2"
            >
              <div class="d-flex gap-1">
                <i class="bi bi-star-fill text-warning fs-5"></i>
                <i class="bi bi-star-fill text-warning fs-5"></i>
                <i class="bi bi-star-fill text-warning fs-5"></i>
                <i class="bi bi-star-fill text-warning fs-5"></i>
                <i class="bi bi-star-half text-warning fs-5"></i>
              </div>
              <span class="text-muted fw-bold">4.5/5</span>
            </div>
            
          </div>
    </div>
    <div class="container px-4 text-start mt-5">
      <div class="row gx-5">
        <div class="col-lg-9 col-12 mt-5 border-end">
          <div class="d-flex align-items-center gap-3 mb-3">
            <h2>Sobre mí</h2>
            <!-- Botón de editar más discreto -->
            <button
              type="button"
              class="btn-edit-discreto btn-edit-discreto-sm"
              id="btnEdit"
              onclick="habilitarEdicion()"
            >
              <i class="bi bi-pencil"></i>
            </button>
          </div>

          <div class="text-box m-2">
            <!-- Área de texto editable -->
            <div class="mb-3">
              <textarea
                class="form-control text-start align-text-top"
                id="sobreMiTextarea"
                rows="6"
                placeholder="Escribe algo sobre ti..."
                oninput="verificarCambios()"
                disabled
                style="
                  background-color: #f8f9fa;
                  text-align: left;
                  vertical-align: top;
                "
              ></textarea>
            </div>

            <!-- Botones de guardar y cancelar (ocultos inicialmente) -->
            <div class="text-end" id="botonesAccion" style="display: none">
              <button
                type="button"
                class="btn-edit-discreto btn-edit-discreto-sm me-2"
                id="btnCancel"
                onclick="cancelarEdicion()"
              >
                <i class="bi bi-x-lg"></i>
              </button>
              <button
                type="button"
                class="btn-edit-discreto btn-edit-discreto-sm"
                id="btnSave"
                onclick="guardarCambios()"
                disabled
                style="background-color: #28a745; border-color: #28a745; color: white;"
              >
                <i class="bi bi-check-lg"></i>
              </button>
            </div>
          </div>

          <div class="row gx-5">
            <div class="col-md-6 mt-5">
              <div class="d-flex align-items-center gap-3 mb-3">
                <h3>Habilidad que ofrezco</h3>
              </div>
              <div id="habilidadesOfrezco" class="d-flex flex-wrap gap-2">
                <button class="habilidad-ofrezco"><h3 class="mx-3 px-3">Java</h3></button>
                <button
                  type="button"
                  class="btn-edit-discreto mt-2 btn-edit-discreto-sm"
                  onclick="mostrarModal('ofrezco')"
                >
                  <i class="bi bi-pencil"></i>
                </button>
              </div>
            </div>
            <div class="col-md-6 mt-5">
              <div class="d-flex align-items-center gap-3 mb-3">
                <h3>Habilidad que busco</h3>
                
              </div>
              <div id="habilidadesBusco" class="d-flex flex-wrap gap-2">
               <button class="habilidad-busco"><h3 class="mx-3 px-3">React</h3></button>
                <button
                  type="button"
                  class="btn-edit-discreto mt-2 btn-edit-discreto-sm"
                  onclick="mostrarModal('busco')"
                >
                  <i class="bi bi-pencil"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- Opiniones-->
        <div class="col-lg-3 col-12 mt-5">
          <h2 class="ms-3"><b>Insignias</b></h2>

          <!-- Rating general -->
          <div class="row gx-5 ">
            <div class="col-md-12 mt-4">
              <div
                class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 justify-content-center"
              >
                <div class="col d-flex justify-content-center m-4">
                  <div
                    class="badge-container"
                    data-bs-toggle="tooltip"
                    data-bs-placement="top"
                    title="Innovador Creativo - Por subir un proyecto y tenga una alta valoración"
                  >
                    <img
                      src="/public/img/profileEditable/innovative-creative-badge.png"
                      alt="Innovative Creative Badge"
                      class="badge-img"
                    />
                  </div>
                </div>
                <div class="col d-flex justify-content-center m-4">
                  <div
                    class="badge-container"
                    data-bs-toggle="tooltip"
                    data-bs-placement="top"
                    title="Pionero - Otorgado por ser uno de los primeros en unirte y completar un proyecto"
                  >
                    <img
                      src="/public/img/profileEditable/pioneer-badge.png"
                      alt="Pioneer Badge"
                      class="badge-img"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="container my-5 mt-4">
      <h2 class="my-5 text-center">Mi momento</h2>

      <div class="row">
        <!-- Ejemplo de publicación -->
        <div class="col-md-12 col-lg-12">
          <div class="ms-5">
          <div class="ms-5">
          <div class="ms-5">
          <div class="ms-4">
          <h5 class="card-text ms-5 mb-3">Un poco de lo que enseño</h5>
          </div>
          </div>
          </div>
          </div>
          <div class="post-card text-center">
            <img
              src="/public/img/profileEditable/man-working-with-pencil.png"
              class="card-img-top post-image"
              alt="Imagen de publicación"
            />
            
          </div>
          <div class="me-5">
            <div class="me-5">
              <div class="me-5">
               <div class="me-5"> 
                <div class="me-4">
          <button
          type="button"
          class="btn-edit-discreto  btn-edit-discreto-lg float-end"
          id="editUsernameBtn"><i class="bi bi-pencil"></i>
          <button type="button"
          class="btn-edit-discreto me-2 btn-edit-discreto-lg float-end"
          id="editUsernameBtn"><i class="bi bi-trash"></i></button>
          </div>
          </div>
          </div>
          </div>
          </div>
        </div>
      </div>
    </div>
    <footer id="foot-bar"></footer>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />  
    <script type="module" src="./profileEditable.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
